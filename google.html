<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Baru</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --glass: rgba(255, 255, 255, 0.18);
      --glass-strong: rgba(255, 255, 255, 0.28);
      --text: #ffffff;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      overflow: hidden;
      position: relative;
      padding: 24px;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 1;
    }

    /* MAIN CONTAINER & ANIMASI TEKS */
    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 20px;
    }

    .animated-text-container {
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: nowrap;
    }

    .animated-text {
      background: linear-gradient(
        90deg,
        #ff0055,
        #ff5000,
        #ffcc00,
        #00ff66,
        #00ffff,
        #0066ff,
        #9900ff,
        #ff0055
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: clamp(24px, 3.5vw, 36px);
      font-weight: 800;
      letter-spacing: 1px;
      animation: rgb-shift 4s linear infinite;
      border-right: 3px solid #fff;
      white-space: nowrap;
      padding-right: 5px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .animated-text.powered-mode {
      background: linear-gradient(
        45deg, 
        #ff007f, 
        #ffaa00, 
        #00f0ff, 
        #7000ff, 
        #ff007f
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: 
        pulseGlow 1.8s ease-in-out infinite, 
        gradientShift 4s ease infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { 
        transform: scale(1); 
        filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.5)); 
      }
      50% { 
        transform: scale(1.08); 
        filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.95)); 
      }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes rgb-shift {
      0% { background-position: 0% 50%; border-color: #ffffff; }
      50% { background-position: 100% 50%; border-color: transparent; }
      100% { background-position: 0% 50%; border-color: #ffffff; }
    }

    .google-logo {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
      white-space: nowrap;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .google-logo.show {
      display: flex;
    }

    .google-logo.center-zoom {
      transform: scale(2.1);
    }

    @keyframes smoothBounceIn {
      0% {
        transform: translateX(120vw) translateY(0) scale(0.98);
        opacity: 0;
      }
      55% {
        transform: translateX(12vw) translateY(-18px) scale(1);
        opacity: 1;
      }
      72% {
        transform: translateX(6vw) translateY(6px);
      }
      86% {
        transform: translateX(2vw) translateY(-4px);
      }
      100% {
        transform: translateX(0) translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .item {
      opacity: 0;
      display: inline-block;
      will-change: transform, opacity;
    }

    .google-logo.show .item {
      animation: 
        smoothBounceIn 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards,
        waveFloat 2.2s ease-in-out infinite 1.8s;
    }

    .google-logo.show .g-letter-cap-g { animation-delay: 0.00s, 1.80s; }
    .google-logo.show .g-letter-o1    { animation-delay: 0.15s, 1.95s; }
    .google-logo.show .g-letter-o2    { animation-delay: 0.30s, 2.10s; }
    .google-logo.show .g-letter-g     { animation-delay: 0.45s, 2.25s; }
    .google-logo.show .g-letter-l     { animation-delay: 0.60s, 2.40s; }
    .google-logo.show .g-letter-e     { animation-delay: 0.75s, 2.55s; }

    .g-text-letter {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 60px;
      font-weight: 700;
      color: #d7d7d7;
      text-shadow:
        0 2px 0 #8f8f8f,
        -2px -1px 0 #ffffff,
        1px 1px 2px rgba(0, 0, 0, 0.35);
      letter-spacing: -2px;
      display: inline-block;
    }

    .ai-brand-text {
      display: none;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px rgba(255, 255, 255, 0.5),
        0 0 30px rgba(255, 255, 255, 0.3);
      letter-spacing: 1.5px;
    }

    .ai-brand-text.show {
      display: inline-block;
      animation: popInWhite 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, whiteGlow 2s ease-in-out infinite alternate;
    }

    @keyframes popInWhite {
      0% { transform: scale(0.4) rotate(-3deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes whiteGlow {
      0% {
        text-shadow: 
          0 0 10px rgba(255, 255, 255, 0.8),
          0 0 20px rgba(255, 255, 255, 0.4);
      }
      100% {
        text-shadow: 
          0 0 15px rgba(255, 255, 255, 1),
          0 0 30px rgba(255, 255, 255, 0.8),
          0 0 45px rgba(255, 255, 255, 0.5);
      }
    }

    /* TOMBOL DAN SEARCH BAR */
    .button-group {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-top: 4px;
    }

    .circle-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .circle-btn:hover {
      background: var(--glass-strong);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .circle-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .pop-content {
      position: absolute;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .pop-content.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .search-wrapper {
      width: 100%;
      max-width: 650px;
      position: relative;
      margin-top: 10px;
    }

    .search-bar {
      width: 100%;
      background: #fff;
      height: 52px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 10;
    }

    .search-bar.has-suggestions {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .search-icon {
      color: #70757a;
      margin-right: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #202124;
      background: transparent;
      min-width: 0;
    }

    /* DROPDOWN MODE AI */
    .actions-right {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .ai-dropdown-wrapper {
      position: relative;
    }

    .ai-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #f1f3f4;
      border: 1px solid #dadce0;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #3c4043;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ai-btn:hover {
      background-color: #e8eaed;
      transform: scale(1.03);
    }

    .ai-dropdown-menu {
      position: absolute;
      top: 110%;
      right: 0;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 20;
      width: 150px;
    }

    .ai-dropdown-menu.show {
      display: flex;
    }

    .ai-option {
      padding: 10px 14px;
      font-size: 13px;
      color: #202124;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .ai-option:hover {
      background: #f1f3f4;
    }

    /* SUGGESTIONS BOX */
    .suggestions-box {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      background: #ffffff;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: none;
      z-index: 9;
      padding-top: 6px;
      padding-bottom: 8px;
      border-top: 1px solid #e0e0e0;
    }

    .suggestion-item {
      padding: 10px 20px;
      font-size: 15px;
      color: #202124;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .suggestion-item:hover,
    .suggestion-item.selected {
      background-color: #f1f3f4;
    }

    .suggestion-item svg {
      width: 16px;
      height: 16px;
      fill: #70757a;
      flex-shrink: 0;
    }

    /* MODAL PREVIEW AI */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-box h3 {
      margin-bottom: 12px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ai-preview-content {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #e0e0e0;
      min-height: 100px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      padding: 9px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: #ffffff;
    }

    @media (max-width: 768px) {
      .animated-text-container {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay loop muted playsinline preload="auto">
    <source src="Video pxm.mov" type="video/mp4">
  </video>

  <div class="bg-overlay"></div>

  <div class="main-container">
    
    <div class="animated-text-container">
      <span class="animated-text" id="typing-text"></span>

      <!-- LOGO GOOGLE -->
      <div class="google-logo" id="google-logo">
        <span class="item g-text-letter g-letter-cap-g">G</span>
        <span class="item g-text-letter g-letter-o1">o</span>
        <span class="item g-text-letter g-letter-o2">o</span>
        <span class="item g-text-letter g-letter-g">g</span>
        <span class="item g-text-letter g-letter-l">l</span>
        <span class="item g-text-letter g-letter-e">e</span>
      </div>

      <!-- TEKS GOOGLE AI -->
      <div class="ai-brand-text" id="ai-brand-text">Google AI</div>
    </div>

    <div class="button-group">
      <div class="circle-btn" id="btn-search-trigger" title="Pencarian Google">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>
    </div>

    <div class="search-wrapper pop-content" id="search-container">
      <form class="search-bar" id="search-form" action="https://www.google.com/search" method="GET">
        <div class="search-icon" id="search-submit" title="Cari">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <input
          type="text"
          name="q"
          id="search-input"
          class="search-input"
          placeholder="Telusuri Google atau ketik pertanyaan AI..."
          autocomplete="off"
        />

        <div class="actions-right">
          <div class="ai-dropdown-wrapper">
            <button type="button" class="ai-btn" id="ai-btn-trigger">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
              </svg>
              Mode AI ▾
            </button>
            <div class="ai-dropdown-menu" id="ai-menu">
              <div class="ai-option" data-model="gemini">✦ Gemini</div>
              <div class="ai-option" data-model="chatgpt">🤖 ChatGPT</div>
              <div class="ai-option" data-model="claude">🧡 Claude</div>
              <div class="ai-option" data-model="perplexity">🌐 Perplexity</div>
            </div>
          </div>
        </div>
      </form>

      <div class="suggestions-box" id="suggestions-box"></div>
    </div>

  </div>

  <!-- MODAL PREVIEW AI RINGKAS -->
  <div class="modal-overlay" id="ai-preview-modal">
    <div class="modal-box">
      <h3>
        <span id="ai-modal-title">Pratinjau Jawaban AI</span>
        <span style="font-size: 12px; opacity:0.7;" id="ai-model-badge">Gemini</span>
      </h3>
      <div class="ai-preview-content" id="ai-preview-body">
        Sedang memproses ringkasan jawaban...
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-close-ai-modal" class="btn-secondary">Tutup</button>
        <button type="button" id="btn-open-full-ai" class="btn-primary">Buka Halaman Penuh ↗</button>
      </div>
    </div>
  </div>

  <script>
  // =========================================================
  // 🤖 LOGIKA MODE AI LENGKAP (DROPDOWN + PREVIEW POPUP)
  // =========================================================
  const aiTriggerBtn = document.getElementById('ai-btn-trigger');
  const aiMenu = document.getElementById('ai-menu');
  const aiPreviewModal = document.getElementById('ai-preview-modal');
  const aiPreviewBody = document.getElementById('ai-preview-body');
  const aiModelBadge = document.getElementById('ai-model-badge');
  const btnCloseAiModal = document.getElementById('btn-close-ai-modal');
  const btnOpenFullAi = document.getElementById('btn-open-full-ai');
  const searchInput = document.getElementById("search-input");

  let selectedAiModel = "gemini";
  let targetAiUrl = "";

  // Buka/Tutup Dropdown AI
  aiTriggerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    aiMenu.classList.toggle('show');
  });

  document.addEventListener('click', () => {
    aiMenu.classList.remove('show');
  });

  // Pemilihan Model AI dari Dropdown
  document.querySelectorAll('.ai-option').forEach(option => {
    option.addEventListener('click', (e) => {
      selectedAiModel = e.target.getAttribute('data-model');
      const query = searchInput.value.trim();

      aiMenu.classList.remove('show');

      if (!query) {
        // Jika tidak ada teks pencarian, langsung buka halaman AI pilihan
        window.location.href = getAiFullUrl(selectedAiModel, "");
      } else {
        // Jika ada pertanyaan, tampilkan Modal Preview AI terlebih dahulu
        triggerAiPreviewModal(selectedAiModel, query);
      }
    });
  });

  function getAiFullUrl(model, query) {
    const q = encodeURIComponent(query);
    switch (model) {
      case 'chatgpt':
        return q ? `https://chatgpt.com/?q=${q}` : 'https://chatgpt.com/';
      case 'claude':
        return q ? `https://claude.ai/new?q=${q}` : 'https://claude.ai/';
      case 'perplexity':
        return q ? `https://www.perplexity.ai/search?q=${q}` : 'https://www.perplexity.ai/';
      case 'gemini':
      default:
        return q ? `https://gemini.google.com/app?q=${q}` : 'https://gemini.google.com/';
    }
  }

  function triggerAiPreviewModal(model, query) {
    targetAiUrl = getAiFullUrl(model, query);
    aiModelBadge.textContent = model.toUpperCase();
    aiPreviewBody.innerHTML = `⚡ <i>Menyiapkan ikhtisar ringkas untuk:</i> <b>"${query}"</b>...`;
    aiPreviewModal.classList.add('active');

    // Simulasi Jawaban Ringkas AI Langsung di Tab
    setTimeout(() => {
      aiPreviewBody.innerHTML = `
        <p><b>Pratinjau Hasil Ringkas (${model.toUpperCase()}):</b></p>
        <p style="margin-top:8px;">Berikut adalah ringkasan awal mengenai topik <i>"${query}"</i>. Klik tombol di bawah untuk melanjutkan percakapan mendalam dan analisis lengkap langsung di platform <b>${model.toUpperCase()}</b>.</p>
      `;
    }, 1000);
  }

  btnCloseAiModal.addEventListener('click', () => {
    aiPreviewModal.classList.remove('active');
  });

  btnOpenFullAi.addEventListener('click', () => {
    window.location.href = targetAiUrl;
  });

  // =========================================================
  // ✍️ LOGIKA ANIMASI KETIK & SEARCH BAR (ORIGINAL)
  // =========================================================
  const words = ["Welcome Firman!", "What are you looking for today?", "Start searching with", "Powered by"];
  let wordIndex = 0;
  let charIndex = 0;
  let isDeleting = false;

  const KECEPATAN_KETIK      = 80;   
  const KECEPATAN_HAPUS      = 40;   
  const DIAM_KALIMAT_1_DAN_2 = 6000; 
  const DIAM_BERSAMA_LOGO    = 6000; 
  const LOGO_ZOOM_SENDIRIAN  = 6000;

  const typingElement = document.getElementById("typing-text");
  const googleLogo = document.getElementById("google-logo");
  const aiBrandText = document.getElementById("ai-brand-text");
  const btnSearchTrigger = document.getElementById("btn-search-trigger");
  const searchContainer = document.getElementById("search-container");
  const searchForm = document.getElementById("search-form");
  const suggestionsBox = document.getElementById("suggestions-box");
  const searchBar = document.querySelector(".search-bar");
  let currentFocus = -1;

  function typeEffect() {
    const currentWord = words[wordIndex];

    if (wordIndex === 3) {
      typingElement.classList.add("powered-mode");
    } else {
      typingElement.classList.remove("powered-mode");
    }

    if (isDeleting) {
      charIndex--;
      typingElement.textContent = currentWord.substring(0, charIndex);
    } else {
      charIndex++;
      typingElement.textContent = currentWord.substring(0, charIndex);
    }

    let typeSpeed = isDeleting ? KECEPATAN_HAPUS : KECEPATAN_KETIK;

    if (!isDeleting && charIndex === currentWord.length) {
      if (wordIndex === 2) { 
        googleLogo.classList.add("show");
        googleLogo.classList.remove("center-zoom"); 
        aiBrandText.classList.remove("show");
        typeSpeed = DIAM_BERSAMA_LOGO;
      } else if (wordIndex === 3) {
        googleLogo.classList.remove("show");
        aiBrandText.classList.add("show");
        typeSpeed = DIAM_BERSAMA_LOGO;
      } else {
        googleLogo.classList.remove("show");
        aiBrandText.classList.remove("show");
        typeSpeed = DIAM_KALIMAT_1_DAN_2;
      }
      
      isDeleting = true;
    } 
    else if (isDeleting && charIndex === 0) {
      if (wordIndex === 2) {
        googleLogo.classList.add("center-zoom");

        setTimeout(() => {
          googleLogo.classList.remove("show");
          googleLogo.classList.remove("center-zoom");
          
          isDeleting = false;
          wordIndex = (wordIndex + 1) % words.length;
          setTimeout(typeEffect, 500);
        }, LOGO_ZOOM_SENDIRIAN);

        return;
      } else if (wordIndex === 3) {
        setTimeout(() => {
          aiBrandText.classList.remove("show");
          
          isDeleting = false;
          wordIndex = (wordIndex + 1) % words.length;
          setTimeout(typeEffect, 500);
        }, LOGO_ZOOM_SENDIRIAN);

        return;
      } else {
        googleLogo.classList.remove("show");
        aiBrandText.classList.remove("show");
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        typeSpeed = 500;
      }
    }

    setTimeout(typeEffect, typeSpeed);
  }

  typeEffect();

  window.handleSuggestions = function(data) {
    const suggestions = data?.[1] || [];
    if (suggestions.length > 0) showSuggestions(suggestions);
    else hideSuggestions();
  };

  function fetchSuggestions(query) {
    if (!query.trim()) {
      hideSuggestions();
      return;
    }

    const oldScript = document.getElementById("jsonp-suggestions");
    if (oldScript) oldScript.remove();

    const script = document.createElement("script");
    script.id = "jsonp-suggestions";
    script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleSuggestions`;
    document.body.appendChild(script);
  }

  function showSuggestions(list) {
    suggestionsBox.innerHTML = "";
    currentFocus = -1;

    list.slice(0, 6).forEach((text) => {
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>${text}</span>
      `;

      item.addEventListener("click", () => {
        searchInput.value = text;
        searchForm.submit();
      });

      suggestionsBox.appendChild(item);
    });

    suggestionsBox.style.display = "block";
    searchBar.classList.add("has-suggestions");
  }

  function hideSuggestions() {
    suggestionsBox.style.display = "none";
    suggestionsBox.innerHTML = "";
    searchBar.classList.remove("has-suggestions");
    currentFocus = -1;
  }

  function debounce(func, delay) {
    let timeoutId;
    return function (...args) {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => func.apply(this, args), delay);
    };
  }

  const debouncedFetchSuggestions = debounce(fetchSuggestions, 300);

  searchInput.addEventListener("input", (e) => {
    debouncedFetchSuggestions(e.target.value);
  });

  searchInput.addEventListener("keydown", (e) => {
    const items = suggestionsBox.getElementsByClassName("suggestion-item");

    if (e.key === "ArrowDown") {
      e.preventDefault();
      currentFocus++;
      addActive(items);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      currentFocus--;
      addActive(items);
    } else if (e.key === "Enter") {
      if (currentFocus > -1 && items[currentFocus]) {
        e.preventDefault();
        items[currentFocus].click();
      }
    } else if (e.key === "Escape") {
      hideSuggestions();
    }
  });

  function addActive(items) {
    if (!items || items.length === 0) return;
    removeActive(items);

    if (currentFocus >= items.length) currentFocus = 0;
    if (currentFocus < 0) currentFocus = items.length - 1;

    items[currentFocus].classList.add("selected");
    searchInput.value = items[currentFocus].querySelector("span").textContent;
  }

  function removeActive(items) {
    for (let i = 0; i < items.length; i++) {
      items[i].classList.remove("selected");
    }
  }

  document.addEventListener("click", (e) => {
    if (!searchContainer.contains(e.target)) hideSuggestions();
  });

  btnSearchTrigger.addEventListener("mouseenter", () => {
    searchContainer.classList.add("active");
    setTimeout(() => searchInput.focus(), 100);
  });

  searchContainer.addEventListener("mouseleave", () => {
    if (document.activeElement !== searchInput && searchInput.value === "" && !aiMenu.classList.contains("show")) {
      searchContainer.classList.remove("active");
    }
  });

  searchForm.addEventListener("submit", (e) => {
    const query = searchInput.value.trim();
    if (!query) {
      e.preventDefault();
      return;
    }

    if (/^(https?:\/\/)/i.test(query)) {
      e.preventDefault();
      window.location.href = query;
    } else if (/^[\w-]+(\.[\w-]+)+/.test(query)) {
      e.preventDefault();
      window.location.href = "https://" + query;
    }
  });

  document.getElementById("search-submit").addEventListener("click", () => {
    if (searchInput.value.trim() !== "") searchForm.requestSubmit();
  });
</script>
</body>
</html>
