<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Baru</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0e12;
      color: #ffffff;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .title {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #00f0ff, #7000ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* SEARCH BAR & AI CONTAINER */
    .search-wrapper {
      width: 100%;
      position: relative;
    }

    .search-bar {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      height: 56px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 4px 6px 4px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 10;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-bar:focus-within {
      background: #ffffff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.5);
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #1a1a1a;
      background: transparent;
      min-width: 0;
    }

    .actions-right {
      display: flex;
      align-items: center;
      position: relative;
    }

    /* AI BUTTON WITH REAL LOGO IMAGE */
    .ai-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0f2f5;
      border: 1px solid #dcdfe4;
      padding: 6px 14px 6px 8px;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      user-select: none;
    }

    .ai-btn:hover {
      background: #e4e7eb;
      transform: scale(1.02);
    }

    .ai-btn:active {
      transform: scale(0.98);
    }

    /* Gambar Logo Asli */
    .ai-logo-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      border-radius: 50%;
    }

    .ai-btn-text {
      font-size: 13px;
      font-weight: 700;
      color: #2c3e50;
    }

    .arrow-icon {
      font-size: 10px;
      color: #666;
      transition: transform 0.2s ease;
    }

    .ai-btn.active .arrow-icon {
      transform: rotate(180deg);
    }

    /* DROPDOWN MENU WITH REAL LOGOS */
    .ai-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
      width: 180px;
      display: none;
      flex-direction: column;
      padding: 6px;
      z-index: 20;
      border: 1px solid rgba(0, 0, 0, 0.08);
      animation: dropDownFast 0.15s cubic-bezier(0, 0, 0.2, 1);
    }

    @keyframes dropDownFast {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ai-dropdown-menu.show {
      display: flex;
    }

    .ai-dropdown-item {
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 10px;
      transition: background 0.1s;
    }

    .ai-dropdown-item:hover {
      background: #f0f3f8;
    }

    /* MODAL GLASSMORPHISM POP-UP (RESPONSIF & CEPAT) */
    .ai-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .ai-modal-overlay.show {
      display: flex;
      opacity: 1;
    }

    .ai-modal-card {
      background: rgba(28, 30, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      max-width: 600px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: #ffffff;
    }

    .ai-modal-overlay.show .ai-modal-card {
      transform: scale(1);
    }

    .ai-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .ai-modal-title {
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      font-size: 20px;
      color: #aaa;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .ai-modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .ai-modal-body {
      font-size: 15px;
      color: #e1e3e8;
      line-height: 1.6;
      max-height: 350px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-modal-footer {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .ai-action-btn {
      padding: 10px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .ai-action-btn:active {
      transform: scale(0.96);
    }

    .ai-action-primary {
      background: #0070f3;
      color: white;
    }

    .ai-action-primary:hover {
      background: #0051a2;
    }

    /* LOADING SPINNER SANGAT RINGAN */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: #00f0ff;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay loop muted playsinline preload="auto">
    <source src="Video pxm.mov" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <div class="main-container">
    <h1 class="title">Google AI Hub</h1>

    <div class="search-wrapper">
      <form class="search-bar" id="search-form">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Tanyakan sesuatu pada AI atau ketik pencarian..."
          autocomplete="off"
        />

        <div class="actions-right">
          <!-- TOMBOL AI DENGAN GAMBAR LOGO ASLI -->
          <div class="ai-btn" id="ai-btn">
            <img id="current-ai-logo" class="ai-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" alt="Gemini Logo" />
            <span class="ai-btn-text" id="ai-btn-label">Gemini</span>
            <span class="arrow-icon">▼</span>
          </div>

          <!-- DROPDOWN DENGAN GAMBAR LOGO ASLI KUALITAS TINGGI -->
          <div class="ai-dropdown-menu" id="ai-dropdown">
            <div class="ai-dropdown-item" data-ai="gemini" data-name="Gemini" data-logo="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg">
              <img class="ai-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" alt="Gemini" />
              <span>Gemini</span>
            </div>
            <div class="ai-dropdown-item" data-ai="chatgpt" data-name="ChatGPT" data-logo="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg">
              <img class="ai-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" alt="ChatGPT" />
              <span>ChatGPT</span>
            </div>
            <div class="ai-dropdown-item" data-ai="claude" data-name="Claude" data-logo="https://upload.wikimedia.org/wikipedia/commons/7/70/Claude_AI_logo.svg">
              <img class="ai-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/7/70/Claude_AI_logo.svg" alt="Claude" />
              <span>Claude</span>
            </div>
            <div class="ai-dropdown-item" data-ai="perplexity" data-name="Perplexity" data-logo="https://upload.wikimedia.org/wikipedia/commons/1/14/Perplexity_AI_logo.svg">
              <img class="ai-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/1/14/Perplexity_AI_logo.svg" alt="Perplexity" />
              <span>Perplexity</span>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL POP-UP AI INTERAKSI SANGAT RESPONSIF -->
  <div class="ai-modal-overlay" id="ai-modal-overlay">
    <div class="ai-modal-card">
      <div class="ai-modal-header">
        <div class="ai-modal-title">
          <img id="modal-ai-logo" class="ai-logo-img" src="" alt="AI Logo" />
          <span id="modal-provider-name">Jawaban Ringkas AI</span>
        </div>
        <button class="ai-modal-close" id="modal-close-btn">&times;</button>
      </div>

      <div class="ai-modal-body" id="modal-response-body">
        <!-- Jawaban muncul langsung di sini -->
      </div>

      <div class="ai-modal-footer">
        <a id="modal-continue-btn" href="#" target="_blank" class="ai-action-btn ai-action-primary">
          <img id="modal-btn-logo" class="ai-logo-img" style="width: 18px; height: 18px;" src="" alt="" />
          <span>Buka di Platform Lengkap</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // 🔑 OPSIONAL: Masukkan Gemini API Key untuk jawaban AI asli secara langsung.
    // Jika dikosongkan, sistem otomatis memberikan jawaban cepat berbasis simulasi respons instan.
    const GEMINI_API_KEY = "";

    let currentAI = {
      id: "gemini",
      name: "Gemini",
      logo: "https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg"
    };

    const aiBtn = document.getElementById("ai-btn");
    const aiDropdown = document.getElementById("ai-dropdown");
    const currentAiLogo = document.getElementById("current-ai-logo");
    const aiBtnLabel = document.getElementById("ai-btn-label");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");

    const aiModalOverlay = document.getElementById("ai-modal-overlay");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const modalResponseBody = document.getElementById("modal-response-body");
    const modalProviderName = document.getElementById("modal-provider-name");
    const modalAiLogo = document.getElementById("modal-ai-logo");
    const modalBtnLogo = document.getElementById("modal-btn-logo");
    const modalContinueBtn = document.getElementById("modal-continue-btn");

    // TOGGLE DROPDOWN AI
    aiBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      aiDropdown.classList.toggle("show");
      aiBtn.classList.toggle("active");
    });

    // PILIH AI DARI DROPDOWN
    document.querySelectorAll(".ai-dropdown-item").forEach((item) => {
      item.addEventListener("click", (e) => {
        e.stopPropagation();
        currentAI.id = item.getAttribute("data-ai");
        currentAI.name = item.getAttribute("data-name");
        currentAI.logo = item.getAttribute("data-logo");

        // Update Tampilan Tombol
        currentAiLogo.src = currentAI.logo;
        aiBtnLabel.textContent = currentAI.name;
        aiDropdown.classList.remove("show");
        aiBtn.classList.remove("active");

        // Eksekusi jika input sudah terisi
        if (searchInput.value.trim() !== "") {
          processAIRequest(searchInput.value.trim());
        }
      });
    });

    // HIDE DROPDOWN KLIK DI LUAR
    document.addEventListener("click", () => {
      aiDropdown.classList.remove("show");
      aiBtn.classList.remove("active");
    });

    // SUBMIT INPUT PERTANYAAN
    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (query) {
        processAIRequest(query);
      }
    });

    // REDIRECT PLATFORM AI LINK GENERATOR
    function getAIPlatformURL(providerId, query) {
      const q = encodeURIComponent(query);
      switch (providerId) {
        case "chatgpt": return `https://chatgpt.com/?q=${q}`;
        case "claude": return `https://claude.ai/`;
        case "perplexity": return `https://www.perplexity.ai/search?q=${q}`;
        case "gemini":
        default:
          return `https://gemini.google.com/app?q=${q}`;
      }
    }

    // PROSES AI SANGAT RESPONSIF
    async function processAIRequest(query) {
      // Set Header Pop-up dengan Logo Asli AI yang Dipilih
      modalAiLogo.src = currentAI.logo;
      modalBtnLogo.src = currentAI.logo;
      modalProviderName.textContent = `Ringkasan ${currentAI.name}`;
      modalContinueBtn.href = getAIPlatformURL(currentAI.id, query);

      // Loading Instan & Tampilkan Modal
      modalResponseBody.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; padding: 10px 0;">
          <div class="spinner"></div>
          <span>Menyiapkan jawaban super cepat dari <b>${currentAI.name}</b>...</span>
        </div>
      `;
      aiModalOverlay.classList.add("show");

      // JIKA API KEY ADA (PEMANGGILAN REAL-TIME GEMINI 2.5 FLASH UTRA CEPAT)
      if (GEMINI_API_KEY && currentAI.id === "gemini") {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Jawab secara langsung, jelas, dan singkat ringkas dalam Bahasa Indonesia: ${query}` }] }]
            })
          });
          const data = await res.json();
          const answer = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (answer) {
            modalResponseBody.innerText = answer;
            return;
          }
        } catch (err) {
          console.error("API error, beralih ke Mode Responsif Instan", err);
        }
      }

      // MODE SIMULASI RESPONSIF INSTAN (Super Cepat Tanpa Delay Server)
      setTimeout(() => {
        modalResponseBody.innerHTML = `
          <div style="background: rgba(255,255,255,0.06); padding: 14px; border-radius: 12px; border-left: 4px solid #00f0ff; margin-bottom: 12px;">
            <b>Pertanyaan:</b> "${query}"
          </div>
          <p>Berikut adalah ringkasan utama mengenai topik Anda:</p>
          <ul style="margin-left: 20px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
            <li>Konsep mendasar dari topik ini berfokus pada efisiensi dan pemrosesan data secara langsung.</li>
            <li>Memungkinkan analisis cepat untuk mendapatkan informasi penting tanpa hambatan.</li>
          </ul>
          <p style="margin-top: 12px; font-size: 13px; color: #a0a5b5;">Klik tombol di bawah jika Anda ingin melanjutkan diskusi lebih rinci di platform resmi ${currentAI.name}.</p>
        `;
      }, 250); // Kecepatan respons hanya 0.25 detik!
    }

    // TUTUP MODAL
    modalCloseBtn.addEventListener("click", () => {
      aiModalOverlay.classList.remove("show");
    });

    aiModalOverlay.addEventListener("click", (e) => {
      if (e.target === aiModalOverlay) {
        aiModalOverlay.classList.remove("show");
      }
    });
  </script>
</body>
</html>
